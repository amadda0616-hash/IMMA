<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1520" font-family="Arial, sans-serif">
  <!-- Title -->
  <text x="800" y="30" text-anchor="middle" font-size="22" font-weight="bold">
    Multi-Stage Hybrid Framework — Pipeline v2
  </text>
  <text x="800" y="54" text-anchor="middle" font-size="12" fill="#555">
    Khan 2025 base + eDOCr2 / Context-Aware (Khan 2026) / LLM Survey insights · Step 9 Metadata Enrichment added
  </text>

  <!-- Style legend -->
  <g transform="translate(40, 70)">
    <rect x="0"   y="0" width="18" height="14" fill="#FFF4C2" stroke="#444"/>
    <text x="22"  y="11" font-size="11">DL / VLM stage</text>
    <rect x="120" y="0" width="18" height="14" fill="#ffffff" stroke="#444"/>
    <text x="142" y="11" font-size="11">I/O artifact</text>
    <rect x="220" y="0" width="18" height="14" fill="#E6F0FF" stroke="#444"/>
    <text x="242" y="11" font-size="11">Cluster / parent</text>
    <rect x="370" y="0" width="18" height="14" fill="#F0F0F0" stroke="#444"/>
    <text x="392" y="11" font-size="11">Deterministic / rule</text>
    <rect x="530" y="0" width="18" height="14" fill="#FFE6CC" stroke="#444"/>
    <text x="552" y="11" font-size="11">Knowledge base</text>
    <rect x="660" y="0" width="18" height="14" fill="#FFD6D6" stroke="#444"/>
    <text x="682" y="11" font-size="11">HITL / human</text>
    <rect x="770" y="0" width="18" height="14" fill="#E8F5E9" stroke="#444"/>
    <text x="792" y="11" font-size="11">Final output</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrowEsc" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- ===== INPUT ===== -->
  <g>
    <rect x="40" y="120" width="200" height="60" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <text x="140" y="150" text-anchor="middle" font-size="14" font-weight="bold">Mechanical Drawing</text>
    <text x="140" y="168" text-anchor="middle" font-size="11" fill="#555">JPG (KO / EN / JP / RU)</text>
  </g>
  <line x1="140" y1="180" x2="140" y2="215" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STEP 1.5 SORT ===== -->
  <g>
    <rect x="40" y="220" width="200" height="80" rx="6" fill="#FFF4C2" stroke="#444" stroke-width="1.5"/>
    <text x="140" y="245" text-anchor="middle" font-size="13" font-weight="bold">Sort by TitleBlock</text>
    <text x="140" y="262" text-anchor="middle" font-size="10" fill="#555">Pytesseract multilingual</text>
    <text x="140" y="276" text-anchor="middle" font-size="10" fill="#555">+ line-density heuristic</text>
    <text x="140" y="293" text-anchor="middle" font-size="9"  fill="#888">sort_by_titleblock.py</text>
  </g>
  <line x1="140" y1="300" x2="140" y2="340" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="20"  y="345" width="100" height="40" fill="#ffffff" stroke="#333"/>
    <text x="70"  y="361" text-anchor="middle" font-size="10" font-weight="bold">stage1_titleblock</text>
    <text x="70"  y="375" text-anchor="middle" font-size="9"  fill="#555">→ Stage 1 train</text>
    <rect x="130" y="345" width="100" height="40" fill="#ffffff" stroke="#333"/>
    <text x="180" y="361" text-anchor="middle" font-size="10" font-weight="bold">stage2_no_titleblock</text>
    <text x="180" y="375" text-anchor="middle" font-size="9"  fill="#555">→ Stage 2 train</text>
    <rect x="240" y="345" width="80"  height="40" fill="#ffffff" stroke="#333"/>
    <text x="280" y="361" text-anchor="middle" font-size="10" font-weight="bold">manual_review</text>
    <text x="280" y="375" text-anchor="middle" font-size="9"  fill="#555">→ human</text>
  </g>

  <!-- ===== INFERENCE PIPELINE CONTAINER ===== -->
  <rect x="380" y="100" width="1180" height="780" rx="12" fill="none" stroke="#aaa" stroke-dasharray="6,4"/>
  <text x="970" y="120" text-anchor="middle" font-size="13" font-style="italic" fill="#666">
    Inference Pipeline (runtime; sorter above is data-prep only)
  </text>

  <!-- Drawing → Stage 1 -->
  <line x1="240" y1="150" x2="430" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== STAGE 1 ===== -->
  <g>
    <rect x="430" y="135" width="220" height="90" rx="6" fill="#FFF4C2" stroke="#444" stroke-width="1.5"/>
    <text x="540" y="160" text-anchor="middle" font-size="14" font-weight="bold">Stage 1: YOLOv11-det</text>
    <text x="540" y="178" text-anchor="middle" font-size="11" fill="#444">Layout Segmentation</text>
    <text x="540" y="194" text-anchor="middle" font-size="10" fill="#555">axis-aligned BBox</text>
    <text x="540" y="218" text-anchor="middle" font-size="9"  fill="#888">stage1_layout.py</text>
  </g>
  <line x1="540" y1="225" x2="540" y2="260" stroke="#333" stroke-width="1.5"/>
  <line x1="370" y1="260" x2="710" y2="260" stroke="#333" stroke-width="1.5"/>

  <!-- Stage 1 outputs -->
  <line x1="430" y1="260" x2="430" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g><rect x="370" y="305" width="120" height="40" fill="#E6F0FF" stroke="#333"/><text x="430" y="322" text-anchor="middle" font-size="12" font-weight="bold">View regions</text><text x="430" y="338" text-anchor="middle" font-size="9" fill="#555">multi-view crops</text></g>
  <line x1="560" y1="260" x2="560" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g><rect x="510" y="305" width="100" height="40" fill="#E6F0FF" stroke="#333"/><text x="560" y="322" text-anchor="middle" font-size="12" font-weight="bold">TitleBlock</text><text x="560" y="338" text-anchor="middle" font-size="9" fill="#555">crop</text></g>
  <line x1="680" y1="260" x2="680" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g><rect x="630" y="305" width="100" height="40" fill="#E6F0FF" stroke="#333"/><text x="680" y="322" text-anchor="middle" font-size="12" font-weight="bold">Notes</text><text x="680" y="338" text-anchor="middle" font-size="9" fill="#555">crop</text></g>

  <!-- ===== STAGE 2 ===== -->
  <line x1="430" y1="345" x2="430" y2="385" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="320" y="390" width="220" height="90" rx="6" fill="#FFF4C2" stroke="#444" stroke-width="1.5"/>
    <text x="430" y="415" text-anchor="middle" font-size="14" font-weight="bold">Stage 2: YOLOv11-obb</text>
    <text x="430" y="433" text-anchor="middle" font-size="11" fill="#444">Annotation Localization</text>
    <text x="430" y="449" text-anchor="middle" font-size="10" fill="#555">oriented BBox (OBB)</text>
    <text x="430" y="473" text-anchor="middle" font-size="9"  fill="#888">stage2_annotation.py</text>
  </g>

  <line x1="430" y1="480" x2="430" y2="510" stroke="#333" stroke-width="1.5"/>
  <line x1="285" y1="510" x2="575" y2="510" stroke="#333" stroke-width="1.5"/>

  <line x1="290" y1="510" x2="290" y2="545" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g><rect x="225" y="550" width="130" height="40" fill="#E6F0FF" stroke="#333"/><text x="290" y="567" text-anchor="middle" font-size="11" font-weight="bold">Measure OBB</text><text x="290" y="582" text-anchor="middle" font-size="9" fill="#555">dim. radii threads</text></g>
  <line x1="430" y1="510" x2="430" y2="545" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g><rect x="375" y="550" width="110" height="40" fill="#E6F0FF" stroke="#333"/><text x="430" y="567" text-anchor="middle" font-size="11" font-weight="bold">GDT OBB</text><text x="430" y="582" text-anchor="middle" font-size="9" fill="#555">FCF (whole)</text></g>
  <line x1="570" y1="510" x2="570" y2="545" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g><rect x="505" y="550" width="130" height="40" fill="#E6F0FF" stroke="#333"/><text x="570" y="567" text-anchor="middle" font-size="11" font-weight="bold">Roughness OBB</text><text x="570" y="582" text-anchor="middle" font-size="9" fill="#555">surface symbols</text></g>

  <!-- ===== DE-ROTATION ===== -->
  <line x1="430" y1="590" x2="430" y2="620" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="320" y="625" width="220" height="55" rx="6" fill="#F0F0F0" stroke="#444" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="430" y="648" text-anchor="middle" font-size="12" font-weight="bold">Perspective-warp de-rotation</text>
    <text x="430" y="665" text-anchor="middle" font-size="9" fill="#666">cv2.getPerspectiveTransform → upright</text>
    <text x="430" y="676" text-anchor="middle" font-size="8" fill="#888">D-012</text>
  </g>

  <!-- ===== STAGE 3-N ===== -->
  <line x1="430" y1="680" x2="430" y2="715" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="290" y="720" width="280" height="90" rx="6" fill="#FFF4C2" stroke="#444" stroke-width="1.5"/>
    <text x="430" y="745" text-anchor="middle" font-size="14" font-weight="bold">Stage 3-N: Donut Numerical</text>
    <text x="430" y="763" text-anchor="middle" font-size="11" fill="#444">fine-tuned (epoch 30, FP16)</text>
    <text x="430" y="779" text-anchor="middle" font-size="10" fill="#555">schema-defined JSON</text>
    <text x="430" y="803" text-anchor="middle" font-size="9"  fill="#888">stage3_numerical.py</text>
  </g>

  <!-- ===== STAGE 3-A (right branch) ===== -->
  <line x1="560" y1="345" x2="560" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="680" y1="345" x2="680" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="560" y1="380" x2="900" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="680" y1="380" x2="900" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="900" y1="380" x2="900" y2="490" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="760" y="495" width="280" height="90" rx="6" fill="#FFF4C2" stroke="#444" stroke-width="1.5"/>
    <text x="900" y="520" text-anchor="middle" font-size="14" font-weight="bold">Stage 3-A: Donut Alphabetical</text>
    <text x="900" y="538" text-anchor="middle" font-size="11" fill="#444">zero-shot DocVQA</text>
    <text x="900" y="554" text-anchor="middle" font-size="10" fill="#555">free-form JSON</text>
    <text x="900" y="578" text-anchor="middle" font-size="9"  fill="#888">stage3_alphabetical.py</text>
  </g>

  <!-- ===== STAGE 4 JSON MERGER ===== -->
  <line x1="430" y1="810" x2="430" y2="855" stroke="#333" stroke-width="1.5"/>
  <line x1="430" y1="855" x2="900" y2="855" stroke="#333" stroke-width="1.5"/>
  <line x1="900" y1="585" x2="900" y2="855" stroke="#333" stroke-width="1.5"/>
  <line x1="900" y1="855" x2="1280" y2="855" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="1280" y="820" width="240" height="70" rx="6" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
    <text x="1400" y="845" text-anchor="middle" font-size="13" font-weight="bold">Stage 4: JSON Merger</text>
    <text x="1400" y="862" text-anchor="middle" font-size="10" fill="#555">unify + global coords</text>
    <text x="1400" y="884" text-anchor="middle" font-size="9"  fill="#888">pipeline.py</text>
  </g>

  <!-- ===== UNIFIED JSON (intermediate) ===== -->
  <line x1="1400" y1="890" x2="1400" y2="925" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="1280" y="930" width="240" height="60" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <text x="1400" y="955" text-anchor="middle" font-size="13" font-weight="bold">Unified Structured JSON</text>
    <text x="1400" y="975" text-anchor="middle" font-size="10" fill="#555">Stage 4 output (pre-enrichment)</text>
  </g>

  <!-- ===== STEP 9 BANNER ===== -->
  <line x1="1400" y1="990" x2="1400" y2="1015" stroke="#333" stroke-width="1.5"/>
  <line x1="800" y1="1015" x2="1400" y2="1015" stroke="#333" stroke-width="1.5"/>
  <line x1="800" y1="1015" x2="800" y2="1045" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="1050" width="1520" height="380" rx="14" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="800" y="1075" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">
    Step 9 — Metadata Enrichment (extension; deterministic-first cascade)
  </text>
  <text x="800" y="1093" text-anchor="middle" font-size="10" font-style="italic" fill="#666">
    Adapted from Khan 2026 (Context-Aware Mapping) · provenance + confidence + HITL gate
  </text>

  <!-- ===== 9.1 GAP DETECTION ===== -->
  <g>
    <rect x="60" y="1110" width="220" height="100" rx="6" fill="#F0F0F0" stroke="#444" stroke-width="1.5"/>
    <text x="170" y="1135" text-anchor="middle" font-size="13" font-weight="bold">9.1 Gap Detection</text>
    <text x="170" y="1153" text-anchor="middle" font-size="10" fill="#555">schema diff vs. expected</text>
    <text x="170" y="1167" text-anchor="middle" font-size="10" fill="#555">missing/ambiguous fields</text>
    <text x="170" y="1185" text-anchor="middle" font-size="9"  fill="#888">e.g. material="stainless"</text>
    <text x="170" y="1198" text-anchor="middle" font-size="9"  fill="#888">→ tag for resolution</text>
  </g>
  <line x1="280" y1="1160" x2="320" y2="1160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== 9.2 DETERMINISTIC ===== -->
  <g>
    <rect x="320" y="1110" width="240" height="100" rx="6" fill="#F0F0F0" stroke="#444" stroke-width="1.5"/>
    <text x="440" y="1135" text-anchor="middle" font-size="13" font-weight="bold">9.2 Deterministic Lookup</text>
    <text x="440" y="1153" text-anchor="middle" font-size="10" fill="#555">KB direct match</text>
    <text x="440" y="1167" text-anchor="middle" font-size="10" fill="#555">ISO 2768 / KS / JIS / GOST</text>
    <text x="440" y="1185" text-anchor="middle" font-size="9"  fill="#888">resolved → method=&quot;deterministic&quot;</text>
    <text x="440" y="1198" text-anchor="middle" font-size="9"  fill="#888">conf ≈ 0.95+</text>
  </g>
  <line x1="560" y1="1160" x2="600" y2="1160" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrowEsc)" stroke-dasharray="4,3"/>
  <text x="580" y="1150" text-anchor="middle" font-size="9" fill="#c0392b" font-style="italic">unresolved</text>

  <!-- ===== 9.3 HEURISTIC ===== -->
  <g>
    <rect x="600" y="1110" width="240" height="100" rx="6" fill="#F0F0F0" stroke="#444" stroke-width="1.5"/>
    <text x="720" y="1135" text-anchor="middle" font-size="13" font-weight="bold">9.3 Engineering Heuristics</text>
    <text x="720" y="1153" text-anchor="middle" font-size="10" fill="#555">domain rules</text>
    <text x="720" y="1167" text-anchor="middle" font-size="10" fill="#555">Ø symbol, M(d) thread, n×</text>
    <text x="720" y="1185" text-anchor="middle" font-size="9"  fill="#888">resolved → method=&quot;heuristic&quot;</text>
    <text x="720" y="1198" text-anchor="middle" font-size="9"  fill="#888">conf ≈ 0.80</text>
  </g>
  <line x1="840" y1="1160" x2="880" y2="1160" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrowEsc)" stroke-dasharray="4,3"/>
  <text x="860" y="1150" text-anchor="middle" font-size="9" fill="#c0392b" font-style="italic">unresolved</text>

  <!-- ===== 9.4 LLM ESCALATION ===== -->
  <g>
    <rect x="880" y="1110" width="280" height="100" rx="6" fill="#FFF4C2" stroke="#444" stroke-width="1.5"/>
    <text x="1020" y="1135" text-anchor="middle" font-size="13" font-weight="bold">9.4 RAG-Augmented LLM</text>
    <text x="1020" y="1153" text-anchor="middle" font-size="10" fill="#555">Gemini / Qwen-VL / Claude</text>
    <text x="1020" y="1167" text-anchor="middle" font-size="10" fill="#555">+ retrieval over KB + image</text>
    <text x="1020" y="1185" text-anchor="middle" font-size="9"  fill="#888">method=&quot;llm&quot; · evidence + alts</text>
    <text x="1020" y="1198" text-anchor="middle" font-size="9"  fill="#888">conf &lt; 0.95</text>
  </g>
  <line x1="1160" y1="1160" x2="1200" y2="1160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== 9.5 HITL GATE ===== -->
  <g>
    <rect x="1200" y="1110" width="240" height="100" rx="6" fill="#FFD6D6" stroke="#444" stroke-width="1.5"/>
    <text x="1320" y="1135" text-anchor="middle" font-size="13" font-weight="bold">9.5 HITL Flag Gate</text>
    <text x="1320" y="1153" text-anchor="middle" font-size="10" fill="#555">if conf &lt; 0.70</text>
    <text x="1320" y="1167" text-anchor="middle" font-size="10" fill="#555">flagged_for_review = true</text>
    <text x="1320" y="1185" text-anchor="middle" font-size="9"  fill="#888">human edit → final value</text>
    <text x="1320" y="1198" text-anchor="middle" font-size="9"  fill="#888">D-022 (θ=0.70)</text>
  </g>

  <!-- ===== KB RESOURCES (below LLM stage) ===== -->
  <line x1="1020" y1="1210" x2="1020" y2="1245" stroke="#666" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="1020" y="1238" text-anchor="middle" font-size="9" fill="#666" font-style="italic">RAG retrieval</text>

  <g>
    <rect x="780" y="1250" width="480" height="90" rx="6" fill="#FFE6CC" stroke="#444" stroke-width="1.5"/>
    <text x="1020" y="1272" text-anchor="middle" font-size="12" font-weight="bold">Knowledge Base (data/kb/)</text>
    <text x="800" y="1295" font-size="10" fill="#444">• material_catalog.json   (KS / JIS / GOST / ANSI mapping)</text>
    <text x="800" y="1311" font-size="10" fill="#444">• iso_2768_defaults.json  (general tolerance defaults)</text>
    <text x="800" y="1327" font-size="10" fill="#444">• machining_roughness_table.json    ·    gdt_priors.json</text>
  </g>

  <!-- KB to deterministic lookup arrow -->
  <line x1="780" y1="1295" x2="560" y2="1210" stroke="#888" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>
  <line x1="780" y1="1295" x2="840" y2="1210" stroke="#888" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>

  <!-- ===== FINAL ENRICHED OUTPUT ===== -->
  <line x1="1320" y1="1210" x2="1320" y2="1370" stroke="#333" stroke-width="1.5"/>
  <line x1="170"  y1="1210" x2="170"  y2="1370" stroke="#333" stroke-width="1.5"/>
  <line x1="170"  y1="1370" x2="1320" y2="1370" stroke="#333" stroke-width="1.5"/>
  <line x1="800"  y1="1370" x2="800"  y2="1395" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="600" y="1400" width="400" height="80" rx="8" fill="#E8F5E9" stroke="#2e7d32" stroke-width="2"/>
    <text x="800" y="1428" text-anchor="middle" font-size="15" font-weight="bold">Enriched Structured JSON</text>
    <text x="800" y="1448" text-anchor="middle" font-size="10" fill="#555">unified + provenance + confidence + alternatives + HITL flags</text>
    <text x="800" y="1466" text-anchor="middle" font-size="9"  fill="#888">outputs/&lt;drawing_id&gt;.enriched.json</text>
  </g>

  <!-- ===== Side callouts ===== -->
  <g font-size="10" fill="#666" font-style="italic">
    <text x="1580" y="170"  text-anchor="end">stage1_layout.py</text>
    <text x="1580" y="430"  text-anchor="end">stage2_annotation.py</text>
    <text x="1580" y="650"  text-anchor="end">D-012 (de-rotation)</text>
    <text x="1580" y="555"  text-anchor="end">stage3_alphabetical.py</text>
    <text x="1580" y="775"  text-anchor="end">stage3_numerical.py</text>
    <text x="1580" y="950"  text-anchor="end">pipeline.py</text>
    <text x="1580" y="1090" text-anchor="end" fill="#c0392b">stage5_enrichment.py</text>
  </g>

  <!-- ===== Footer ===== -->
  <text x="800" y="1500" text-anchor="middle" font-size="10" fill="#999">
    Architecture: Khan et al. 2025 · eDOCr2 absorbed (D-016) · Step 9 from Khan 2026 + Singh-Sadhu 2026 · v2 (2026-04-26)
  </text>
</svg>
